<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">

</head>
<body>    
        
    <div class = 'container border p-5 w-50 btn-center'>
        <br>
        <h1 class = 'display-5 text-center '>Calorie Input Page</h1>
        <br>
        <div class = 'container bg-primary-white w-50 text-center'>
            <label class = 'form-labal' for = 'name'> Food Name: </label>
            <input class = 'form-control' type = 'name' name = 'name' id = 'name' required>
        </div>
        <br>
        <div class = 'container bg-primary-white w-50 text-center'>
            <label class = 'form-label' for = 'Calories'> Total Calories: </label>
            <input class = 'form-control' type = 'calories' name = 'calories' id = 'calories' required>
        </div>
        <br>
        <div class = 'container bg-primary-white w-50 text-center'>
            <label class = 'form-labal' for = 'Time'> Time: </label>
            <input class = 'form-control' type = 'time' name = 'time' id = 'time' required>
        </div>
        <br>
        <div class = 'container bg-primary-white w-50 text-center'>
            <label class = 'form-labal' for = 'meal type'> Meal Type: </label>
            <input class = 'form-control mb-4' type = 'meal type' name = 'meal type' id = 'meal type' required>
        </div>
        <br>
        <div class = 'text-center'> 
            <input class = 'btn btn-secondary w-10 mb-4' type = 'submit' value = 'Save'>
        </div>
        <br>
        <p class = 'text-center'><a class = 'btn btn-danger w-10 mb-4 text-center' href = '/dashboard'>Home</a></p>
    </body>
    </html>
