<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Home Page</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">



</head>
<body>
    <div class = 'container border p-5 bg-primary-subtle w-50'>

        <h1 class = 'display-5 text-center'>MyFitnessTracker</h1>


        <form action = '/authenticate', method = 'post'>
            <div class = 'mb-3'>
                <label class = 'form-label' for = 'username'> username: </label>
                <input class = 'form-control' type = 'text' name = 'username' id = 'username' required>
            </div>
            <div>
                <label class = 'form-labal' for = 'password'> password: </label>
                <input class = 'form-control mb-4' type = 'password' name = 'password' id = 'password' required>
            </div>
            <div> 
                <input class = 'btn btn-secondary w-100 mb-4' type = 'submit' value = 'login'>
            </div>
        </form>
        Don't have an account? <a href = '/signup'>Sign Up</a>
        <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz" crossorigin="anonymous"></script>

    </div>
</body>
</html>
