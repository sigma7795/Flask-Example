<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
    <title>Sign up page</title>
</head>
<body>
    <div class = 'container border p-5 bg-primary-subtle w-50'>
        <h1 class = 'display-5 text-center'>Sign Up Now!</h1>

    
    <form action = '/createUser' method = 'post'>
        <div class = 'mb-3'>
            <label class = 'form-label' for = 'Username'> Username:  </label>
            <input class = 'form-control' type = 'text' name = 'Username' id = 'Username' required>
        </div>
        <div>
            <label class = 'form-label' for = 'Password'>Password:  </label>
            <input class = 'form-control mb-4' type = password name = 'Password' id = 'Password' required>
        </div>

        <div>
            <label class = 'form-label' for = 'rePassword'>Re-enter Password:  </label>
            <input class = 'form-control mb-4' type = password name = 'rePassword' id = 'rePassword' required>
        </div>

        <div>
            <input class = 'btn btn-secondary w-100 mb-4' type = 'submit' value = 'Login'>
        </div>
    </form>

    Already have an account?  <a href = '/'>Login</a>
</body>
</html>
