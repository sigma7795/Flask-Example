<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0"> 
    <!-- Sets page type, dimensions, character set, language -->
    <title>Document</title>

</head>
<body>
    <div>
        <h1>Workout Input Page</h1>
        <!-- Creates title -->
        <form action = '/workoutinput' method = 'POST'>
            <div>
                <label for = 'workoutName'> Title: </label>
                <input type = 'text' name = 'workoutName' id = 'workoutName' required>
            </div>
            <!-- Creates workout title input box -->
            <div> 
                <label for = 'workoutType'> Type: </label>
                <select id= 'workoutType' name = "workoutType" required>
                    <option name = "workoutType" value="run">Run</option>
                    <option name = "workoutType" value="cycle">Cycle</option>
                    <option name = "workoutType" value="swim">Swim</option>
                </select>
            </div>
            <!-- Creates workout type input box -->
            <div>
                <label for = 'workoutDistance'> Distance: </label>
                <input type = 'text' name = 'workoutDistance' id = 'workoutDistance' required> km
            </div>
            <!-- Creates a workout distance input box -->
            <div>
                <label for = 'workoutTime'> Time: </label>
                <input type = 'number' name = 'workoutTime' id = 'workoutTime' required> minutes
            </div>
            <!-- Creates a workout time input box -->
            <div> 
                <input type = 'submit' value = 'Save'>
            </div>
            <!-- Creates save button -->
        </form>
        <p class = 'text-center'><a href = '/dashboard'>Home</a></p>
        <!-- Creates home button which takes user back to dashboard page-->
    </div>
</body>
</html>
