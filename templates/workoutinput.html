<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">

</head>
<body>

    <div class = 'container border p-5 w-50 btn-center'>

        <h1 class = 'display-5 text-center'>Workout Input Page</h1>

            <div class = 'container bg-primary-white w-50 text-center'>
                <label class = 'form-label' for = 'Title'> Title: </label>
                <input class = 'form-control' type = 'text' name = 'title' id = 'title' required>
            </div>
            
            <div class = 'container bg-primary-white w-50 text-center'> 
                <label class = 'form-label' for = 'Type'> Type: </label>
                <input class = 'form-control' type = 'text' name = 'type' id = 'type' required>
            </div>
            <div class = 'container bg-primary-white w-50 text-center'>
                <label class = 'form-labal' for = 'Distance'> Distance: </label>
                <input class = 'form-control ' type = 'distance' name = 'distance' id = 'distance' required>
            </div>
            <div class = 'container bg-primary-white w-50 text-center'>
                <label class = 'form-label' for = 'Time'> Time: </label>
                <input class = 'form-control' type = 'time' name = 'time' id = 'time' required>
            </div>
            <br>
            <div class = 'container bg-primary-white w-50 text-center'> 
                <input class = 'btn btn-secondary w-100 mb-4' type = 'submit' value = 'Save'>
            </div>
        </form>
        <p class = 'text-center'><a class = 'btn btn-danger w-10 mb-4 text-center' href = '/dashboard'>Home</a></p>
        <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz" crossorigin="anonymous"></script>

    </div>
</body>
</html>
